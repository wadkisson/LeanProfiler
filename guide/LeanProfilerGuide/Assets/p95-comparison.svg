<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="356" viewBox="0 0 1120 356" role="img" aria-labelledby="comparison-title comparison-desc">
  <title id="comparison-title">Baseline and candidate p95 comparison</title>
  <desc id="comparison-desc">Paired dots compare p95 duration for three span groups. The candidate increases the forward delay, causing model.forward and the enclosing example span to regress.</desc>
  <rect width="100%" height="100%" fill="#fbfcfe" rx="12"/>
  <text x="24" y="31" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#152536">p95 comparison</text>
  <text x="24" y="53" font-family="system-ui, sans-serif" font-size="13" fill="#58677a">Policy: 0.5 ms absolute and 10% relative allowance; an increase must cross both.</text>
  <circle cx="24" cy="79" r="6" fill="#263849"/>
  <text x="37" y="83" font-family="system-ui, sans-serif" font-size="12" fill="#58677a">baseline</text>
  <circle cx="112" cy="79" r="6" fill="#c73e3e"/>
  <text x="125" y="83" font-family="system-ui, sans-serif" font-size="12" fill="#58677a">candidate</text>
  <text x="24" y="122" font-family="system-ui, sans-serif" font-size="14" font-weight="650" fill="#152536">example.nested-spans</text>
  <text x="24" y="142" font-family="system-ui, sans-serif" font-size="12" fill="#c73e3e">regression</text>
  <line x1="300" y1="118" x2="950" y2="118" stroke="#d9e1ea" stroke-width="2"/>
  <line x1="628" y1="118" x2="950" y2="118" stroke="#c73e3e" stroke-width="4" opacity="0.55"/>
  <g aria-label="example.nested-spans; baseline 18.44 ms; candidate 36.45 ms; regression"><circle cx="628" cy="118" r="7" fill="#263849"><title>example.nested-spans; baseline 18.44 ms; candidate 36.45 ms; regression</title></circle><circle cx="950" cy="118" r="8" fill="#c73e3e"><title>example.nested-spans; baseline 18.44 ms; candidate 36.45 ms; regression</title></circle></g>
  <text x="968" y="115" font-family="ui-monospace, monospace" font-size="11" fill="#263849">B 18.44 ms</text>
  <text x="968" y="133" font-family="ui-monospace, monospace" font-size="11" fill="#c73e3e">C 36.45 ms</text>
  <text x="24" y="198" font-family="system-ui, sans-serif" font-size="14" font-weight="650" fill="#152536">input.load</text>
  <text x="24" y="218" font-family="system-ui, sans-serif" font-size="12" fill="#168c80">improvement</text>
  <line x1="300" y1="194" x2="950" y2="194" stroke="#d9e1ea" stroke-width="2"/>
  <line x1="336" y1="194" x2="336" y2="194" stroke="#168c80" stroke-width="4" opacity="0.55"/>
  <g aria-label="input.load [phase=input, activity=load]; baseline 2.06 ms; candidate 2.06 ms; improvement"><circle cx="336" cy="194" r="7" fill="#263849"><title>input.load [phase=input, activity=load]; baseline 2.06 ms; candidate 2.06 ms; improvement</title></circle><circle cx="336" cy="194" r="8" fill="#168c80"><title>input.load [phase=input, activity=load]; baseline 2.06 ms; candidate 2.06 ms; improvement</title></circle></g>
  <text x="968" y="191" font-family="ui-monospace, monospace" font-size="11" fill="#263849">B 2.06 ms</text>
  <text x="968" y="209" font-family="ui-monospace, monospace" font-size="11" fill="#168c80">C 2.06 ms</text>
  <text x="24" y="274" font-family="system-ui, sans-serif" font-size="14" font-weight="650" fill="#152536">model.forward</text>
  <text x="24" y="294" font-family="system-ui, sans-serif" font-size="12" fill="#c73e3e">regression</text>
  <line x1="300" y1="270" x2="950" y2="270" stroke="#d9e1ea" stroke-width="2"/>
  <line x1="372" y1="270" x2="479" y2="270" stroke="#c73e3e" stroke-width="4" opacity="0.55"/>
  <g aria-label="model.forward [phase=forward, module=encoder.block]; baseline 4.06 ms; candidate 10.06 ms; regression"><circle cx="372" cy="270" r="7" fill="#263849"><title>model.forward [phase=forward, module=encoder.block]; baseline 4.06 ms; candidate 10.06 ms; regression</title></circle><circle cx="479" cy="270" r="8" fill="#c73e3e"><title>model.forward [phase=forward, module=encoder.block]; baseline 4.06 ms; candidate 10.06 ms; regression</title></circle></g>
  <text x="968" y="267" font-family="ui-monospace, monospace" font-size="11" fill="#263849">B 4.06 ms</text>
  <text x="968" y="285" font-family="ui-monospace, monospace" font-size="11" fill="#c73e3e">C 10.06 ms</text>
</svg>
