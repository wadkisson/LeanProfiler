<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="366" viewBox="0 0 1120 366" role="img" aria-labelledby="breakdown-title breakdown-desc">
  <title id="breakdown-title">Inclusive and self time in the nested example</title>
  <desc id="breakdown-desc">Horizontal bars compare inclusive duration with self duration for the root, source-analysis, and source-read summary rows.</desc>
  <rect width="100%" height="100%" fill="#fbfcfe" rx="8"/>
  <text x="24" y="32" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#152536">Where the recorded time went</text>
  <text x="24" y="54" font-family="system-ui, sans-serif" font-size="13" fill="#58677a">Outlined bars show inclusive time; solid bars show self time after same-thread children are removed.</text>
  <rect x="24" y="72" width="18" height="10" rx="2" fill="#dce5ee" stroke="#aebed0"/>
  <text x="50" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#58677a">inclusive</text>
  <rect x="126" y="72" width="18" height="10" rx="2" fill="#425466"/>
  <text x="152" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#58677a">self</text>
  <text x="24" y="117" font-family="system-ui, sans-serif" font-size="14" font-weight="650" fill="#152536">example.source-indexer</text>
  <text x="24" y="139" font-family="system-ui, sans-serif" font-size="12" fill="#58677a">1 call</text>
  <g aria-label="example.source-indexer; inclusive 18.55 ms; self 114.82 us; 1 calls"><rect x="270" y="100" width="650" height="32" rx="5" fill="#dce5ee" stroke="#aebed0" stroke-width="1"><title>example.source-indexer; inclusive 18.55 ms; self 114.82 us; 1 calls</title></rect><rect x="270" y="109" width="4" height="14" rx="4" fill="#425466"><title>example.source-indexer; inclusive 18.55 ms; self 114.82 us; 1 calls</title></rect></g>
  <text x="938" y="111" font-family="ui-monospace, monospace" font-size="11" fill="#58677a">total 18.55 ms</text>
  <text x="938" y="129" font-family="ui-monospace, monospace" font-size="11" fill="#425466">self  114.82 us</text>
  <text x="24" y="195" font-family="system-ui, sans-serif" font-size="14" font-weight="650" fill="#152536">source.analyze</text>
  <text x="24" y="217" font-family="system-ui, sans-serif" font-size="12" fill="#58677a">3 calls</text>
  <g aria-label="source.analyze; inclusive 12.22 ms; self 12.22 ms; 3 calls"><rect x="270" y="178" width="428" height="32" rx="5" fill="#dce5ee" stroke="#aebed0" stroke-width="1"><title>source.analyze; inclusive 12.22 ms; self 12.22 ms; 3 calls</title></rect><rect x="270" y="187" width="428" height="14" rx="4" fill="#168c80"><title>source.analyze; inclusive 12.22 ms; self 12.22 ms; 3 calls</title></rect></g>
  <text x="938" y="189" font-family="ui-monospace, monospace" font-size="11" fill="#58677a">total 12.22 ms</text>
  <text x="938" y="207" font-family="ui-monospace, monospace" font-size="11" fill="#168c80">self  12.22 ms</text>
  <text x="24" y="273" font-family="system-ui, sans-serif" font-size="14" font-weight="650" fill="#152536">source.read</text>
  <text x="24" y="295" font-family="system-ui, sans-serif" font-size="12" fill="#58677a">3 calls</text>
  <g aria-label="source.read; inclusive 6.21 ms; self 6.21 ms; 3 calls"><rect x="270" y="256" width="217" height="32" rx="5" fill="#dce5ee" stroke="#aebed0" stroke-width="1"><title>source.read; inclusive 6.21 ms; self 6.21 ms; 3 calls</title></rect><rect x="270" y="265" width="217" height="14" rx="4" fill="#d97706"><title>source.read; inclusive 6.21 ms; self 6.21 ms; 3 calls</title></rect></g>
  <text x="938" y="267" font-family="ui-monospace, monospace" font-size="11" fill="#58677a">total 6.21 ms</text>
  <text x="938" y="285" font-family="ui-monospace, monospace" font-size="11" fill="#d97706">self  6.21 ms</text>
</svg>
